server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 256;

    # Página do Convidado (raiz)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Página dos Pais (gerador /criar)
    location /criar {
        try_files $uri $uri/ /criar/index.html;
    }

    # Cache longo para bundles e assets versionados pelo Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
