version: "3.8"

services:
  app:
    image: cayquesilva/gravidex:1.0.0
    networks:
      - public-proxy-v2
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.gravidex.rule=Host(`bb.portaleducampina.com.br`)"
        - "traefik.http.routers.gravidex.entrypoints=websecure"
        - "traefik.http.routers.gravidex.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.gravidex.loadbalancer.server.port=80"

networks:
  public-proxy-v2:
    external: true
